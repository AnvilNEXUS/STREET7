<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern Craft — A2 EFL Sentence Lab</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sentence-scale: 1.15;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .sentence-text {
      font-size: calc(1.5rem * var(--sentence-scale));
      line-height: 1.5;
    }

    @media (min-width: 768px) {
      .sentence-text {
        font-size: calc(2.1rem * var(--sentence-scale));
        line-height: 1.45;
      }
    }

    /* Slot pulse effect when awaiting input */
    @keyframes slot-idle-glow {
      0%, 100% { border-color: rgba(99, 102, 241, 0.45); transform: translateY(0); }
      50% { border-color: rgba(99, 102, 241, 0.85); transform: translateY(-1px); }
    }
    .idle-pulse-slot1 {
      animation: slot-idle-glow 2.8s infinite ease-in-out;
    }

    @keyframes slot-idle-emerald {
      0%, 100% { border-color: rgba(16, 185, 129, 0.45); transform: translateY(0); }
      50% { border-color: rgba(16, 185, 129, 0.85); transform: translateY(-1px); }
    }
    .idle-pulse-slot2 {
      animation: slot-idle-emerald 2.8s infinite ease-in-out;
    }

    /* Pop-in animation for slotted badges */
    @keyframes badge-snap {
      0% { transform: scale(0.85) translateY(4px); opacity: 0.4; }
      70% { transform: scale(1.04) translateY(-1px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .badge-snap {
      animation: badge-snap 0.24s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* TTS Sound Wave animation */
    @keyframes sound-bar {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .sound-bar:nth-child(1) { animation: sound-bar 0.7s infinite ease-in-out; }
    .sound-bar:nth-child(2) { animation: sound-bar 0.5s infinite ease-in-out 0.15s; }
    .sound-bar:nth-child(3) { animation: sound-bar 0.65s infinite ease-in-out 0.3s; }
    .sound-bar:nth-child(4) { animation: sound-bar 0.8s infinite ease-in-out 0.1s; }

    /* Custom range slider styling */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 9999px;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transition: transform 0.12s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    input[type=range]::-moz-range-thumb {
      height: 18px;
      width: 18px;
      border-radius: 9999px;
      background: #6366f1;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ================= TOP UTILITY & NAVIGATION BAR ================= -->
  <header class="w-full border-b border-slate-200/80 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Grammar Info -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 text-white flex items-center justify-center font-black text-xl shadow-sm shadow-indigo-500/20">
          ⚡
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black tracking-tight text-base sm:text-lg">Pattern Craft</span>
            <span class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
              A2 Lab
            </span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">24 Exemplary Grammar Sentence Builders</p>
        </div>
      </div>

      <!-- Controls: Text Scaling Slider & Light/Dark Theme Toggle -->
      <div class="flex items-center gap-3 sm:gap-4">
        
        <!-- Text Size UX Slider -->
        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800/80 py-1.5 px-3 rounded-2xl border border-slate-200 dark:border-slate-700/60" title="Slide to adjust sentence display text size">
          <span class="text-xs font-bold text-slate-400 dark:text-slate-500">A-</span>
          <input 
            type="range" 
            id="fontSizeSlider" 
            min="0.9" 
            max="1.65" 
            step="0.05" 
            value="1.15" 
            class="w-18 sm:w-28 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-600"
            aria-label="Sentence Font Size Adjustment"
          />
          <span class="text-base font-extrabold text-slate-800 dark:text-slate-100">A+</span>
        </div>

        <!-- Audio Effects Mute Toggle -->
        <button 
          id="soundFxToggleBtn"
          class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition"
          title="Toggle UI Sound Effects"
          aria-label="Toggle Audio Effects"
        >
          <span id="soundFxIcon" class="text-sm">🔊</span>
        </button>

        <!-- Light / Dark Mode Toggle -->
        <button 
          id="themeToggleBtn"
          class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition"
          title="Toggle Light/Dark Mode"
          aria-label="Toggle Theme"
        >
          <!-- Sun icon -->
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon icon -->
          <svg id="moonIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

      </div>

    </div>
  </header>

  <!-- ================= MAIN WORKSPACE ================= -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 md:py-8 flex flex-col justify-between gap-6">

    <!-- Pattern Switcher Header -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      
      <!-- Pattern Selector Dropdown & Grammar Badge -->
      <div class="flex items-center gap-2 flex-wrap">
        <label for="patternSelect" class="sr-only">Choose Pattern</label>
        <div class="relative inline-block">
          <select 
            id="patternSelect" 
            class="appearance-none font-bold text-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-2xl px-4 py-2 pr-9 shadow-sm text-slate-800 dark:text-slate-100 hover:border-indigo-400 dark:hover:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
          >
            <!-- Populated dynamically via JS -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 dark:text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <span id="patternCategoryBadge" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60">
          Grammar Focus
        </span>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- Randomize Fill Button -->
        <button 
          id="shuffleBtn"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 shadow-sm active:scale-95 transition"
          title="Randomly choose two cards"
        >
          <span>🎲</span>
          <span>Random</span>
        </button>

        <!-- Clear / Revert Both Slots Button -->
        <button 
          id="clearBtn"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 shadow-sm active:scale-95 transition"
          title="Clear active cards"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span>Clear</span>
        </button>

        <!-- Prev / Next Navigation Arrows -->
        <div class="flex items-center rounded-2xl border border-slate-300 dark:border-slate-700 overflow-hidden shadow-sm bg-white dark:bg-slate-900">
          <button 
            id="prevPatternBtn"
            class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border-r border-slate-200 dark:border-slate-700 active:bg-slate-200 transition"
            title="Previous Pattern (Left Arrow)"
            aria-label="Previous Pattern"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button 
            id="nextPatternBtn"
            class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 active:bg-slate-200 transition"
            title="Next Pattern (Right Arrow)"
            aria-label="Next Pattern"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- ================= THE BIG SENTENCE DISPLAY STAGE ================= -->
    <div class="relative w-full rounded-3xl bg-white dark:bg-slate-900 border-2 border-slate-200/90 dark:border-slate-800 p-6 sm:p-10 md:p-12 shadow-xl shadow-slate-200/50 dark:shadow-none flex flex-col justify-center items-center min-h-[240px] transition-all">
      
      <!-- Pattern Target Sentence Container -->
      <div 
        id="sentenceDisplay" 
        class="sentence-text font-black text-center text-slate-800 dark:text-slate-100 flex flex-wrap items-center justify-center gap-x-2.5 gap-y-3"
      >
        <!-- Populated dynamically via JS -->
      </div>

      <!-- Stage Bottom Bar: Text-to-Speech + Help Tip -->
      <div class="mt-8 pt-5 w-full flex flex-wrap items-center justify-between gap-4 border-t border-slate-100 dark:border-slate-800/80">
        
        <!-- Speak / Text to Speech Action -->
        <button 
          id="speakSentenceBtn"
          class="flex items-center gap-2.5 px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-500/25 active:scale-95 transition-all group"
          title="Listen to the completed sentence read aloud (Shortcut: Spacebar)"
        >
          <!-- Audio Wave / Speaker Icon -->
          <div id="audioWaveContainer" class="flex items-center gap-0.5 h-5">
            <svg id="speakerDefaultIcon" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" />
            </svg>
            <div id="waveBars" class="hidden items-center gap-0.5">
              <span class="sound-bar w-1 bg-white rounded-full"></span>
              <span class="sound-bar w-1 bg-white rounded-full"></span>
              <span class="sound-bar w-1 bg-white rounded-full"></span>
              <span class="sound-bar w-1 bg-white rounded-full"></span>
            </div>
          </div>
          <span id="speakBtnLabel">Read Aloud</span>
        </button>

        <!-- Status Helper Tip -->
        <div id="statusTip" class="text-xs font-semibold text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
          <span>Click cards to snap in. Click again to revert.</span>
        </div>

      </div>

    </div>

    <!-- ================= 6-CARD COMPONENT TRAY (2 Columns) ================= -->
    <div class="space-y-4">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <!-- Column 1: Slot 1 Options (Cards 1, 2, 3) -->
        <div class="bg-indigo-50/50 dark:bg-slate-900/40 p-4 sm:p-5 rounded-3xl border border-indigo-100 dark:border-indigo-950/60">
          <div class="flex items-center justify-between mb-3 px-1">
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full bg-indigo-500 inline-block shadow-sm shadow-indigo-500/40"></span>
              <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-700 dark:text-indigo-400">
                Slot 1: <span id="slot1HeaderLabel" class="normal-case font-bold text-slate-600 dark:text-slate-300">Placeholder</span>
              </span>
            </div>
            <span class="text-[11px] font-mono text-slate-400 dark:text-slate-500 font-bold">Keys [1, 2, 3]</span>
          </div>

          <div id="slot1CardsTray" class="grid grid-cols-1 gap-2.5">
            <!-- Rendered dynamically via JS -->
          </div>
        </div>

        <!-- Column 2: Slot 2 Options (Cards 4, 5, 6) -->
        <div class="bg-emerald-50/50 dark:bg-slate-900/40 p-4 sm:p-5 rounded-3xl border border-emerald-100 dark:border-emerald-950/60">
          <div class="flex items-center justify-between mb-3 px-1">
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block shadow-sm shadow-emerald-500/40"></span>
              <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">
                Slot 2: <span id="slot2HeaderLabel" class="normal-case font-bold text-slate-600 dark:text-slate-300">Placeholder</span>
              </span>
            </div>
            <span class="text-[11px] font-mono text-slate-400 dark:text-slate-500 font-bold">Keys [4, 5, 6]</span>
          </div>

          <div id="slot2CardsTray" class="grid grid-cols-1 gap-2.5">
            <!-- Rendered dynamically via JS -->
          </div>
        </div>

      </div>

    </div>

    <!-- Classroom & Keyboard Nav Helper -->
    <footer class="text-center text-xs text-slate-400 dark:text-slate-600 pb-2 flex items-center justify-center gap-3 flex-wrap">
      <span>Keys <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">1-3</kbd> for Slot 1</span>
      <span>•</span>
      <span>Keys <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">4-6</kbd> for Slot 2</span>
      <span>•</span>
      <span><kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">←</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">→</kbd> patterns</span>
      <span>•</span>
      <span><kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">Space</kbd> speak</span>
    </footer>

  </main>

  <!-- ================= FLOATING TOAST FEEDBACK ================= -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-full text-xs sm:text-sm font-bold shadow-xl flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Ready!</span>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    /**
     * 24 BRAND NEW Exemplary A2 EFL Sentence Patterns
     * Covering 24 distinct grammar targets designed for almost-teen boys
     * High engagement: gaming, sports, cool gear, school adventures, humor.
     */
    const PATTERNS_DATA = [
      {
        id: 1,
        title: "Zero Conditional",
        grammar: "Zero Conditional (If + Present, Present)",
        template: ["If you ", "[slot1]", ", the computer screen ", "[slot2]", "."],
        slot1Label: "present simple action",
        slot2Label: "automatic consequence",
        slot1Options: [
          { id: "s1_1", text: "press the power button five times" },
          { id: "s1_2", text: "spill cold energy drink on the keyboard" },
          { id: "s1_3", text: "leave ten video games running at once" }
        ],
        slot2Options: [
          { id: "s2_1", text: "immediately turns completely black" },
          { id: "s2_2", text: "freezes until you restart it" },
          { id: "s2_3", text: "flashes a crazy red error message" }
        ]
      },
      {
        id: 2,
        title: "First Conditional",
        grammar: "First Conditional (If + Present, Will + Verb)",
        template: ["If our team ", "[slot1]", " this afternoon, our coach will ", "[slot2]", "."],
        slot1Label: "condition (present simple)",
        slot2Label: "future reward (will + verb)",
        slot1Options: [
          { id: "s1_1", text: "wins the championship finals" },
          { id: "s1_2", text: "scores five goals in twenty minutes" },
          { id: "s1_3", text: "practices hard without complaining" }
        ],
        slot2Options: [
          { id: "s2_1", text: "order thirty giant pepperoni pizzas" },
          { id: "s2_2", text: "let us skip morning fitness training" },
          { id: "s2_3", text: "jump into the school swimming pool" }
        ]
      },
      {
        id: 3,
        title: "Present Perfect with 'Ever'",
        grammar: "Present Perfect + Ever (Experience)",
        template: ["Have you ever ", "[slot1]", " while ", "[slot2]", "?"],
        slot1Label: "experience (past participle)",
        slot2Label: "activity (gerund -ing)",
        slot1Options: [
          { id: "s1_1", text: "fallen off your skateboard" },
          { id: "s1_2", text: "eaten an entire bag of sour gummies" },
          { id: "s1_3", text: "shouted super loudly at the TV" }
        ],
        slot2Options: [
          { id: "s2_1", text: "playing an intense tournament match" },
          { id: "s2_2", text: "trying to impress your friends" },
          { id: "s2_3", text: "recording a viral TikTok video" }
        ]
      },
      {
        id: 4,
        title: "Obligation: Have To",
        grammar: "Modal Obligation (Have to / Has to)",
        template: ["Every serious gamer has to ", "[slot1]", " before they ", "[slot2]", "."],
        slot1Label: "chore/task (base verb)",
        slot2Label: "fun gaming action",
        slot1Options: [
          { id: "s1_1", text: "clean their messy desk" },
          { id: "s1_2", text: "finish their difficult math homework" },
          { id: "s1_3", text: "charge their wireless headset" }
        ],
        slot2Options: [
          { id: "s2_1", text: "log into the multiplayer battle royale" },
          { id: "s2_2", text: "join the squad voice call" },
          { id: "s2_3", text: "stream live to their followers" }
        ]
      },
      {
        id: 5,
        title: "Prohibition: Must Not",
        grammar: "Prohibition (Must not / Mustn't)",
        template: ["You must not ", "[slot1]", " or the referee will ", "[slot2]", "!"],
        slot1Label: "forbidden action (base verb)",
        slot2Label: "penalty consequence",
        slot1Options: [
          { id: "s1_1", text: "kick the ball after the whistle" },
          { id: "s1_2", text: "argue loudly with the opposing coach" },
          { id: "s1_3", text: "grab the goalkeeper's jersey" }
        ],
        slot2Options: [
          { id: "s2_1", text: "blow his whistle and give a red card" },
          { id: "s2_2", text: "eject you straight from the field" },
          { id: "s2_3", text: "award a penalty shot to the other team" }
        ]
      },
      {
        id: 6,
        title: "Advice: Should Never",
        grammar: "Advice & Warning (Should never + verb)",
        template: ["You should never ", "[slot1]", " when you are ", "[slot2]", "!"],
        slot1Label: "bad idea (base verb)",
        slot2Label: "risky situation (gerund -ing)",
        slot1Options: [
          { id: "s1_1", text: "eat greasy chips with bare hands" },
          { id: "s1_2", text: "attempt a double backflip" },
          { id: "s1_3", text: "leave your backpack unzipped" }
        ],
        slot2Options: [
          { id: "s2_1", text: "holding a brand new white controller" },
          { id: "s2_2", text: "riding your bicycle downhill fast" },
          { id: "s2_3", text: "walking past hungry street dogs" }
        ]
      },
      {
        id: 7,
        title: "Past Habits: Used To",
        grammar: "Past Habit (Used to vs Present)",
        template: ["My brother used to ", "[slot1]", ", but now he prefers to ", "[slot2]", "."],
        slot1Label: "childhood habit (base verb)",
        slot2Label: "current teen preference",

    // ================= WEB AUDIO API SOUND GENERATOR =================
    // Zero external sound dependencies
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPopSound() {
      if (!state.soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(740, ctx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.13);
    }

    function playWhooshSound() {
      if (!state.soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(580, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, ctx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function playCelebrationChime() {
      if (!state.soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      
      const playNote = (freq, start, duration) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
        gain.gain.setValueAtTime(0.15, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + duration);
      };

      playNote(523.25, 0.0, 0.18); // C5
      playNote(659.25, 0.09, 0.18); // E5
      playNote(783.99, 0.18, 0.35); // G5
    }

    // ================= INITIALIZATION =================
    function init() {
      // 1. Theme initialization
      const savedTheme = localStorage.getItem('pattern_craft_v2_theme');
      if (savedTheme) {
        setTheme(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        setTheme('dark');
      } else {
        setTheme('light');
      }

      // 2. Sound state initialization
      const savedSound = localStorage.getItem('pattern_craft_sound');
      if (savedSound !== null) {
        state.soundEnabled = savedSound === 'true';
        updateSoundButton();
      }

      // 3. Font scaling initialization
      const savedScale = localStorage.getItem('pattern_craft_v2_font_scale');
      if (savedScale) {
        state.fontSizeScale = parseFloat(savedScale);
        fontSizeSlider.value = savedScale;
      }
      applyFontSize(state.fontSizeScale);

      // 4. Fill pattern selector
      patternSelectEl.innerHTML = '';
      PATTERNS_DATA.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${p.title} (${p.grammar.split(' ')[0]})`;
        patternSelectEl.appendChild(opt);
      });

      // 5. Attach core event handlers
      patternSelectEl.addEventListener('change', (e) => {
        loadPattern(parseInt(e.target.value, 10));
      });

      prevBtn.addEventListener('click', () => navigatePattern(-1));
      nextBtn.addEventListener('click', () => navigatePattern(1));
      shuffleBtn.addEventListener('click', shuffleFill);
      clearBtn.addEventListener('click', clearSlots);
      speakBtn.addEventListener('click', speakSentence);

      fontSizeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.fontSizeScale = val;
        applyFontSize(val);
        localStorage.setItem('pattern_craft_v2_font_scale', val);
      });

      themeToggleBtn.addEventListener('click', toggleTheme);
      soundFxToggleBtn.addEventListener('click', toggleSoundFx);

      // Keyboard navigation & shortcuts
      window.addEventListener('keydown', handleKeyboardShortcuts);

      // Render initial pattern
      loadPattern(0);
    }

    // ================= THEME & SOUND CONTROLS =================
    function setTheme(theme) {
      state.theme = theme;
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
      localStorage.setItem('pattern_craft_v2_theme', theme);
    }

    function toggleTheme() {
      setTheme(state.theme === 'light' ? 'dark' : 'light');
    }

    function toggleSoundFx() {
      state.soundEnabled = !state.soundEnabled;
      localStorage.setItem('pattern_craft_sound', state.soundEnabled);
      updateSoundButton();
      showToast(state.soundEnabled ? 'UI Sounds ON' : 'UI Sounds MUTED', state.soundEnabled ? '🔊' : '🔇');
      if (state.soundEnabled) playPopSound();
    }

    function updateSoundButton() {
      soundFxIcon.textContent = state.soundEnabled ? '🔊' : '🔇';
      soundFxToggleBtn.title = state.soundEnabled ? 'UI Sounds: Enabled (Click to mute)' : 'UI Sounds: Muted (Click to enable)';
    }

    function applyFontSize(scale) {
      document.documentElement.style.setProperty('--sentence-scale', scale);
    }

    function showToast(text, icon = '✨') {
      toastMsg.textContent = text;
      toastIcon.textContent = icon;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1800);
    }

    // ================= PATTERN LOADING & RENDERING =================
    function loadPattern(index) {
      if (index < 0) index = PATTERNS_DATA.length - 1;
      if (index >= PATTERNS_DATA.length) index = 0;

      state.currentIndex = index;
      state.slot1CardId = null;
      state.slot2CardId = null;

      patternSelectEl.value = index;
      const current = PATTERNS_DATA[index];
      patternCategoryBadgeEl.textContent = current.grammar;
      slot1HeaderLabel.textContent = current.slot1Label;
      slot2HeaderLabel.textContent = current.slot2Label;

      renderSentence();
      renderComponentCards();
    }

    function navigatePattern(direction) {
      loadPattern(state.currentIndex + direction);
    }

    function handleKeyboardShortcuts(e) {
      // Ignore if user is interacting with form elements
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        return;
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigatePattern(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigatePattern(1);
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        speakSentence();
      } else if (['1', '2', '3'].includes(e.key)) {
        e.preventDefault();
        const pattern = PATTERNS_DATA[state.currentIndex];
        const cardIndex = parseInt(e.key, 10) - 1;
        if (pattern.slot1Options[cardIndex]) {
          toggleCardSelection(1, pattern.slot1Options[cardIndex].id);
        }
      } else if (['4', '5', '6'].includes(e.key)) {
        e.preventDefault();
        const pattern = PATTERNS_DATA[state.currentIndex];
        const cardIndex = parseInt(e.key, 10) - 4;
        if (pattern.slot2Options[cardIndex]) {
          toggleCardSelection(2, pattern.slot2Options[cardIndex].id);
        }
      }
    }

    // ================= RENDER SENTENCE STAGE =================
    function renderSentence() {
      const pattern = PATTERNS_DATA[state.currentIndex];
      sentenceDisplayEl.innerHTML = '';

      pattern.template.forEach((token) => {
        if (token === '[slot1]') {
          sentenceDisplayEl.appendChild(createSlotElement(1));
        } else if (token === '[slot2]') {
          sentenceDisplayEl.appendChild(createSlotElement(2));
        } else {
          const span = document.createElement('span');
          span.textContent = token;
          span.className = 'inline-block transition-colors';
          sentenceDisplayEl.appendChild(span);
        }
      });
    }

    function createSlotElement(slotNumber) {
      const pattern = PATTERNS_DATA[state.currentIndex];
      const isSlot1 = slotNumber === 1;
      const cardId = isSlot1 ? state.slot1CardId : state.slot2CardId;
      const options = isSlot1 ? pattern.slot1Options : pattern.slot2Options;
      const label = isSlot1 ? pattern.slot1Label : pattern.slot2Label;

      const slotBtn = document.createElement('button');
      slotBtn.type = 'button';
      slotBtn.setAttribute('data-slot', slotNumber);

      if (!cardId) {
        // EMPTY STATE: Dashed Placeholder badge
        slotBtn.className = `group inline-flex items-center gap-1.5 px-3.5 py-1.5 my-1 rounded-2xl border-2 border-dashed font-bold text-xs sm:text-base tracking-wide transition-all cursor-pointer ${
          isSlot1 
            ? 'idle-pulse-slot1 border-indigo-400 dark:border-indigo-500 text-indigo-600 dark:text-indigo-300 bg-indigo-50/60 hover:bg-indigo-100/80 dark:bg-indigo-950/40 dark:hover:bg-indigo-900/50' 
            : 'idle-pulse-slot2 border-emerald-400 dark:border-emerald-500 text-emerald-600 dark:text-emerald-300 bg-emerald-50/60 hover:bg-emerald-100/80 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50'
        }`;
        
        slotBtn.innerHTML = `
          <span class="opacity-80 group-hover:scale-125 transition-transform text-sm">+</span>
          <span class="opacity-95">[ ${label} ]</span>
        `;
        slotBtn.title = `Click to quick-insert first card for ${label}`;
        slotBtn.addEventListener('click', () => {
          toggleCardSelection(slotNumber, options[0].id);
        });
      } else {
        // FILLED STATE: Solid badge with one-click ejection
        const selectedCard = options.find(opt => opt.id === cardId);
        const cardText = selectedCard ? selectedCard.text : '';

        slotBtn.className = `group inline-flex items-center gap-2 px-4 py-1.5 my-1 rounded-2xl font-black shadow-md border transition-all badge-snap cursor-pointer ${
          isSlot1 
            ? 'bg-indigo-600 dark:bg-indigo-500 text-white border-indigo-700 hover:bg-indigo-700 shadow-indigo-500/20' 
            : 'bg-emerald-600 dark:bg-emerald-500 text-white border-emerald-700 hover:bg-emerald-700 shadow-emerald-500/20'
        }`;

        slotBtn.innerHTML = `
          <span>${cardText}</span>
          <span class="w-4 h-4 rounded-full bg-black/25 group-hover:bg-black/40 flex items-center justify-center text-[10px] ml-0.5 transition" title="Click to remove">✕</span>
        `;
        slotBtn.title = `Click to remove "${cardText}"`;
        slotBtn.addEventListener('click', () => {
          ejectSlot(slotNumber);
        });
      }

      return slotBtn;
    }

    // ================= RENDER COMPONENT CARDS =================
    function renderComponentCards() {
      const pattern = PATTERNS_DATA[state.currentIndex];
      renderTrayCards(1, pattern.slot1Options, slot1TrayEl, state.slot1CardId, 1);
      renderTrayCards(2, pattern.slot2Options, slot2TrayEl, state.slot2CardId, 4);
    }

    function renderTrayCards(slotNumber, options, containerEl, currentSelectedId, keyOffset) {
      containerEl.innerHTML = '';
      const isSlot1 = slotNumber === 1;

      options.forEach((opt, idx) => {
        const isSelected = opt.id === currentSelectedId;
        const keyNumber = keyOffset + idx;
        const cardBtn = document.createElement('button');
        cardBtn.type = 'button';
        cardBtn.className = `w-full text-left p-3 sm:p-3.5 rounded-2xl border transition-all duration-150 flex items-center justify-between group active:scale-[0.98] ${
          isSelected 
            ? isSlot1 
              ? 'bg-indigo-600 text-white border-indigo-700 shadow-lg shadow-indigo-500/25 ring-2 ring-indigo-400/50' 
              : 'bg-emerald-600 text-white border-emerald-700 shadow-lg shadow-emerald-500/25 ring-2 ring-emerald-400/50'
            : isSlot1 
              ? 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border-slate-200 dark:border-slate-700 hover:border-indigo-400 dark:hover:border-indigo-500 hover:bg-indigo-50/40 dark:hover:bg-indigo-950/20' 
              : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border-slate-200 dark:border-slate-700 hover:border-emerald-400 dark:hover:border-emerald-500 hover:bg-emerald-50/40 dark:hover:bg-emerald-950/20'
        }`;

        cardBtn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${
              isSelected 
                ? 'bg-white/20 text-white' 
                : isSlot1 
                  ? 'bg-indigo-100 text-indigo-700 dark:bg-slate-700 dark:text-indigo-300' 
                  : 'bg-emerald-100 text-emerald-700 dark:bg-slate-700 dark:text-emerald-300'
            }">
              ${keyNumber}
            </span>
            <span class="font-extrabold text-sm sm:text-base leading-snug">${opt.text}</span>
          </div>

          <!-- Status Indicator Pill -->
          <span class="ml-2 shrink-0 text-xs font-bold px-2 py-0.5 rounded-lg transition-all ${
            isSelected 
              ? 'bg-white/25 text-white' 
              : 'opacity-0 group-hover:opacity-100 text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-700'
          }">
            ${isSelected ? '✓ In Place' : 'Use +'}
          </span>
        `;

        cardBtn.addEventListener('click', () => {
          toggleCardSelection(slotNumber, opt.id);
        });

        containerEl.appendChild(cardBtn);
      });
    }

    // ================= CARD SELECTION / EJECTION =================
    function toggleCardSelection(slotNumber, cardId) {
      if (slotNumber === 1) {
        if (state.slot1CardId === cardId) {
          // Revert back
          state.slot1CardId = null;
          playWhooshSound();
          showToast('Slot 1 reverted to card tray', '↩️');
        } else {
          // Snap in or replace
          state.slot1CardId = cardId;
          playPopSound();
        }
      } else {
        if (state.slot2CardId === cardId) {
          // Revert back
          state.slot2CardId = null;
          playWhooshSound();
          showToast('Slot 2 reverted to card tray', '↩️');
        } else {
          // Snap in or replace
          state.slot2CardId = cardId;
          playPopSound();
        }
      }

      renderSentence();
      renderComponentCards();

      // Celebration sound if both slots are filled
      if (state.slot1CardId && state.slot2CardId) {
        playCelebrationChime();
        showToast('Sentence Completed! Press Space to listen 🔊', '🎉');
      }
    }

    function ejectSlot(slotNumber) {
      if (slotNumber === 1) {
        state.slot1CardId = null;
      } else {
        state.slot2CardId = null;
      }
      playWhooshSound();
      renderSentence();
      renderComponentCards();
      showToast(`Slot ${slotNumber} removed`, '↩️');
    }

    function clearSlots() {
      state.slot1CardId = null;
      state.slot2CardId = null;
      playWhooshSound();
      renderSentence();
      renderComponentCards();
      showToast('Pattern cleared', '🧹');
    }

    function shuffleFill() {
      const pattern = PATTERNS_DATA[state.currentIndex];
      const r1 = Math.floor(Math.random() * pattern.slot1Options.length);
      const r2 = Math.floor(Math.random() * pattern.slot2Options.length);

      state.slot1CardId = pattern.slot1Options[r1].id;
      state.slot2CardId = pattern.slot2Options[r2].id;

      playCelebrationChime();
      renderSentence();
      renderComponentCards();
      showToast('Randomized combination slotted!', '🎲');
    }

    // ================= WEB SPEECH API TEXT TO SPEECH =================
    function getFullSentenceText() {
      const pattern = PATTERNS_DATA[state.currentIndex];
      let sentenceParts = [];

      pattern.template.forEach(token => {
        if (token === '[slot1]') {
          const card = pattern.slot1Options.find(o => o.id === state.slot1CardId);
          sentenceParts.push(card ? card.text : 'something');
        } else if (token === '[slot2]') {
          const card = pattern.slot2Options.find(o => o.id === state.slot2CardId);
          sentenceParts.push(card ? card.text : 'something');
        } else {
          sentenceParts.push(token);
        }
      });

      return sentenceParts.join('').replace(/\s+/g, ' ').trim();
    }

    function speakSentence() {
      if (!('speechSynthesis' in window)) {
        showToast('Speech synthesis is not supported on this device', '⚠️');
        return;
      }

      window.speechSynthesis.cancel();

      const textToSpeak = getFullSentenceText();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);

      // Select natural English voice if available
      const voices = window.speechSynthesis.getVoices();
      const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Alex'))) || voices.find(v => v.lang.startsWith('en'));
      if (englishVoice) {
        utterance.voice = englishVoice;
      }

      // Measured 0.9x speed for clear A2 EFL listening comprehension
      utterance.rate = 0.90;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        state.isSpeaking = true;
        speakerDefaultIcon.classList.add('hidden');
        waveBars.classList.remove('hidden');
        waveBars.classList.add('flex');
        speakBtnLabel.textContent = 'Speaking...';
        speakBtn.classList.add('ring-4', 'ring-indigo-400/40');
      };

      utterance.onend = utterance.onerror = () => {
        state.isSpeaking = false;
        speakerDefaultIcon.classList.remove('hidden');
        waveBars.classList.add('hidden');
        waveBars.classList.remove('flex');
        speakBtnLabel.textContent = 'Read Aloud';
        speakBtn.classList.remove('ring-4', 'ring-indigo-400/40');
      };

      window.speechSynthesis.speak(utterance);
    }

    // Voice preload trigger
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // Start App on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
